<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
    <title>s6704022612111-design</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        background: #111;
      }

      main {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 16px;
      }

      img {
        display: block;
        width: 100%;
        height: calc(100vh - 32px);
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./1.jpg" alt="ภาพ">
    </main>
  </body>
</html>
